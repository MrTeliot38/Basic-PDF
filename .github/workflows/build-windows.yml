name: Construction Windows (Basic PDF)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests unitaires
        run: npm run test:unit

      - name: Construire l'application et l'installateur Windows (.exe sans droits admin)
        run: npm run dist:win

      - name: Publier les artefacts de construction
        uses: actions/upload-artifact@v4
        with:
          name: basic-pdf-windows
          path: |
            release/*.exe
            release/*.exe.sha256
            release/SHA256SUMS-windows.txt

      - name: Créer une Release GitHub lors d'un tag de version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.sha256
            release/SHA256SUMS-windows.txt
